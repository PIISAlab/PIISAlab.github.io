- id: nguyen-thai-hoa
  name: Nguyễn Thái Hoà
  role: undergrad
  status: alumni
  cohort: 22CVD
  photo: /images/NguyenThaiHoa.jpg
  thesis:
    kind: senior-thesis
    title:
      vi: Mô phỏng đa vật lý của các hệ thống anten có thể cấu hình lại bằng kim loại lỏng
      en: Multi-physics simulation of liquid-metal reconfigurable antenna systems
    abstract:
      vi: Các hệ thống anten kim loại lỏng hiện đang thu hút sự quan tâm đặc biệt trong phát triển mạng thông tin di động thế hệ 6 (6G) nhờ khả năng tái cấu hình linh hoạt về cấu trúc hình học và đặc tính bức xạ. Khoá luận này tập trung nghiên cứu giản đồ bức xạ và các tham số hiệu năng đặc trưng của mảng anten kim loại lỏng thông qua mô phỏng điện từ sóng toàn phần (full-wave) trên giao diện Electromagnetic Waves, Frequency Domain của phần mềm COMSOL Multiphysics. Kết quả nghiên cứu phân tích chi tiết tác động của các tham số như số lượng phần tử, cấu hình hình học và tần số hoạt động đến các tham số hiệu năng then chốt như độ lợi (gain) và tổn hao phản xạ (return loss). Những phát hiện này không chỉ cung cấp cái nhìn chuyên sâu về hành vi điện từ của anten kim loại lỏng, mà còn thiết lập khung mô phỏng nền tảng cho các hệ thống anten tái cấu hình dựa trên chất lỏng trong tương lai.
      en: Liquid-metal antenna systems are attracting significant interest in the development of sixth-generation (6G) mobile networks due to their flexible reconfigurability in geometric structure and radiation characteristics. This thesis focuses on the radiation patterns and characteristic performance parameters of liquid-metal antenna arrays through full-wave electromagnetic simulation using the Electromagnetic Waves, Frequency Domain interface in COMSOL Multiphysics. The results provide a detailed analysis of the impact of parameters such as element count, geometric configuration, and operating frequency on key performance metrics including gain and return loss. These findings not only offer deep insight into the electromagnetic behavior of liquid-metal antennas, but also establish a foundational simulation framework for future fluid-based reconfigurable antenna systems.
