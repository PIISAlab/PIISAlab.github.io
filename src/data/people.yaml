- id: truong-trung-kien
  name:
    vi: TS. Trương Trung Kiên
    en: Dr. Kien Truong
  role: pi
  status: current
  photo: /images/kien-truong.jpg
  bio:
    vi:
      - TS. Trương Trung Kiên hiện là Giảng viên tại Bộ môn Vật lý tin học, Khoa Vật lý - Vật lý kỹ thuật, Trường Đại học Khoa học Tự nhiên, ĐHQG-HCM. Ông là Senior Member của IEEE và là cựu sinh viên VEF.
      - Ông nhận bằng Thạc sĩ và Tiến sĩ Kỹ thuật Điện tại Đại học Texas tại Austin (UT Austin) dưới sự hướng dẫn của Giáo sư Robert W. Heath, Jr. Các nghiên cứu của ông tập trung vào Massive MIMO, truyền tải năng lượng không dây và xử lý tín hiệu cho mạng 6G.
    en:
      - Dr. Kien Truong is currently a Lecturer in the Computer Science Physics Division, Faculty of Physics and Engineering Physics, University of Science, VNU-HCM. He is an IEEE Senior Member and a VEF alumnus.
      - He received the M.S. and Ph.D. degrees in Electrical Engineering from The University of Texas at Austin (UT Austin) under the supervision of Prof. Robert W. Heath, Jr. His research interests include Massive MIMO, wireless power transfer, and signal processing for 6G networks.
